services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: budu
      POSTGRES_USER: budu
      POSTGRES_PASSWORD: budu
    ports:
      - "5436:5432"
    volumes:
      - budu_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budu -d budu"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  budu_pg_data:
