<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Tapahtumamanageri's mark: a calendar with one highlighted event.
    It uses the same Pitva service palette as Budu and Klapi, with the amber
    event dot as the small-size focal point.
  -->
  <rect width="32" height="32" rx="7" fill="#221e5c"/>
  <rect x="5" y="7" width="22" height="20" rx="3" fill="none" stroke="#bbd2fb" stroke-width="2"/>
  <path d="M5 13h22" stroke="#bbd2fb" stroke-width="2"/>
  <path d="M11 5v5M21 5v5" stroke="#bbd2fb" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="16" cy="20" r="4" fill="#bd7d0f"/>
  <path d="m14.4 20 1.1 1.1 2.2-2.4" fill="none" stroke="#221e5c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
