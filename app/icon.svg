<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Budu's mark: the talousarvio as three bars, the third one over its line.
    That is the whole app in one picture, and it survives 16px where the
    association's own emblem turns to soup. The colours are the literals behind
    globals.css's primary, cta and warning-mark, hardcoded because an icon file
    cannot read the page's custom properties.
  -->
  <rect width="32" height="32" rx="7" fill="#221e5c"/>
  <rect x="5.5" y="18" width="6" height="8" rx="1.5" fill="#bbd2fb"/>
  <rect x="13" y="13" width="6" height="13" rx="1.5" fill="#bbd2fb"/>
  <rect x="20.5" y="6" width="6" height="20" rx="1.5" fill="#bd7d0f"/>
  <path d="M4 10.5h24" stroke="#bbd2fb" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="3 2.6" opacity=".75"/>
</svg>
